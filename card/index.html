/* ---------------------------------------------------------------- palette */
:root{
  --deep:#1B2E1A;          /* page field                   */
  --sage:#6B8360;          /* terminal body                */
  --cream:#F7F4EF;        /* paper + terminal type        */
  --ink:#1A1A1A;            /* title-bar type               */
  --red:#D9282A; --amber:#EEA515; --lime:#88C048;
  --grid-maj:rgba(159,176,148,.09);
  --grid-min:rgba(159,176,148,.05);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Mono","Roboto Mono",Consolas,monospace;
  --sans:"InterCard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100svh; background-color:var(--deep); color:var(--cream);
  font-family:var(--mono); -webkit-font-smoothing:antialiased;
  padding:1rem 1rem calc(1.25rem + env(safe-area-inset-bottom));
  background-image:
    linear-gradient(var(--grid-maj) .5px,transparent 0),
    linear-gradient(90deg,var(--grid-maj) .5px,transparent 0),
    linear-gradient(var(--grid-min) .5px,transparent 0),
    linear-gradient(90deg,var(--grid-min) .5px,transparent 0);
  background-size:180px 180px,180px 180px,36px 36px,36px 36px;
}
::selection{background:var(--cream);color:var(--deep)}

/* ------------------------------------------------------- terminal window */
.card{
  width:100%; max-width:32rem; margin:0 auto; overflow:hidden;
  display:flex; flex-direction:column;
  background:var(--sage); border-radius:14px;
  box-shadow:0 0 42px rgba(116,119,114,.45);
}
.titlebar{
  display:flex; align-items:center; flex:none;
  height:38px; padding-left:13px; gap:9px; background:var(--cream);
}
.light{width:12px;height:12px;border-radius:50%;flex:none}
.light.r{background:var(--red)} .light.a{background:var(--amber)} .light.g{background:var(--lime)}
.tt{font-family:var(--sans);font-weight:800;color:var(--ink);font-size:13px;line-height:1;margin-left:11px}

/* ------------------------------------------------- right pane: the brand */
.pane-r{order:1;padding:26px 20px 0;text-align:center}
.lockup{max-width:190px;margin:0 auto;filter:drop-shadow(0 0 12px rgba(121,242,6,.22))}
.mark{display:block;width:70px;height:auto;margin:0 auto}
.wordmark{display:block;width:100%;height:auto;margin-top:14px}
.mark path,.wordmark path{fill:var(--cream)}
.tagline{
  font-family:var(--sans); font-weight:600; text-transform:uppercase;
  font-size:11px; line-height:1.55; letter-spacing:.19em; text-indent:.19em;
  margin:16px auto 0; max-width:22rem;
}

.divider{
  order:2; height:1px; margin:22px 20px 0; opacity:.85;
  background:repeating-linear-gradient(90deg,var(--cream) 0 6px,transparent 0 7.2px);
}

/* -------------------------------------------- left pane: the working part */
.pane-l{order:3;padding:20px 20px 24px}
.prompt{font-size:16px;font-weight:700;line-height:1.3;margin:0 0 14px}
.caret{
  display:inline-block; width:.62em; height:1.02em; margin-left:.3em;
  background:var(--cream); vertical-align:-.18em; animation:blink 1.15s steps(1,end) infinite;
}
@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}

.rule{
  height:1px; border:0; margin:0 0 15px;
  background:repeating-linear-gradient(90deg,var(--cream) 0 6px,transparent 0 7.2px);
}
.r2{margin:18px 0}

.ln{font-size:14px;line-height:1.5;color:var(--cream)}
/* Narrow screens wrap these lines. Hanging indents keep the wrap reading like
   terminal output instead of a broken column. */
.ln.t{margin-bottom:12px;padding-left:1.2em;text-indent:-1.2em}
.rows{display:flex;flex-direction:column;gap:2px;margin:0 -10px}
a.ln{
  display:block; text-decoration:none; color:inherit; overflow-wrap:anywhere;
  padding:12px 10px 12px calc(10px + 3.4em); text-indent:-3.4em;
  border-radius:7px; -webkit-tap-highlight-color:transparent;
  transition:background-color .13s ease,color .13s ease;
}
a.ln:active{background:var(--cream);color:var(--deep)}
a.ln:focus-visible{background:var(--cream);color:var(--deep);outline:none}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--mono);font-size:.92em}
.chev{opacity:.92}
.cp{display:none}                       /* desktop-only copy affordance */

.acts{display:flex;flex-direction:column;gap:10px}
.btn{
  display:block; width:100%; text-align:center; text-decoration:none; cursor:pointer;
  font-family:var(--mono); font-size:15px; line-height:1; color:var(--cream);
  background:transparent; border:1.5px dashed rgba(247,244,239,.5); border-radius:9px;
  padding:15px 0; -webkit-tap-highlight-color:transparent;
  transition:background-color .14s ease,color .14s ease,border-color .14s ease;
}
.btn:active,.btn:focus-visible{background:var(--cream);color:var(--deep);border-color:var(--cream);border-style:solid;outline:none}
.btn.ok{background:var(--lime);border-color:var(--lime);color:#1B2E1A;border-style:solid}

.qr{
  display:block; width:162px; height:162px; margin:22px auto 0;
  border:0; padding:0; background:transparent; cursor:zoom-in;
  -webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.26));
}
.qr svg{display:block;width:100%;height:100%}
.qr path{fill:var(--cream)}
.qrcap{font-size:11px;letter-spacing:.06em;opacity:.6;text-align:center;margin:10px auto 0}

/* ------------------------------------------------------- enlarged QR code */
/* The face keeps the printed cream-on-sage code, which is polarity-inverted:
   phone cameras read it, but plenty of scanners will not. This is the copy
   that always scans, and it is one tap away. */
.scan{
  position:fixed; inset:0; z-index:30; padding:1.5rem;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.1rem;
  background:rgba(15,26,14,.94); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  opacity:0; visibility:hidden; transition:opacity .2s ease,visibility .2s;
}
.scan.on{opacity:1;visibility:visible}
.scan .tile{
  width:min(78vw,58vh,22rem); max-width:100%;
  background:var(--cream); border-radius:1rem; padding:1rem;
  box-shadow:0 1.2rem 3.5rem rgba(0,0,0,.55);
}
.scan .tile svg{display:block;width:100%;height:auto}
.scan .tile path{fill:#1B2E1A}
.scan .cap{font-size:.8rem;letter-spacing:.05em;opacity:.75;text-align:center;line-height:1.7}
.scan .btn{width:auto;padding:12px 26px;font-size:14px}

/* ---------------------------------------------------------------- toast */
.toast{
  position:fixed; left:50%; bottom:calc(1.5rem + env(safe-area-inset-bottom));
  transform:translate(-50%,140%); background:var(--cream); color:var(--deep);

  var VCF_NAME = "Syed Adib.vcf";
  var CARD_URL = "https://brewinsight.io/card";
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  /* ------------------------------------------------------------- toast */
  var toastEl = document.getElementById("toast"), toastTimer;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("up");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("up"); }, 2000);
  }

  /* ------------------------------------------------------ save contact */
  /* iOS Safari shows the native "Add to Contacts" sheet when a .vcf is opened
     rather than downloaded, so the download hint is dropped there. */
  var save = document.getElementById("save");
  if (isIOS) save.removeAttribute("download");
  save.addEventListener("click", function(e){
    if (location.protocol !== "file:") return;   /* the sibling .vcf is served */
    e.preventDefault();                          /* opened off disk: build it */
    var blob = new Blob([VCARD], {type:"text/vcard;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = VCF_NAME;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast("Contact downloaded");
  });

  /* ------------------------------------------------------------- share */
  function shareUrl(){
    return location.protocol.indexOf("http") === 0 ? location.href.split("#")[0] : CARD_URL;
  }
  document.getElementById("share").addEventListener("click", function(){
    var data = {title:"Syed Adib — BrewInsight", text:"Syed Adib, Co-founder & Head of Growth at BrewInsight", url:shareUrl()};
    if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
      navigator.share(data).catch(function(){});
      return;
    }
    copy(shareUrl(), "Link");
  });

  /* -------------------------------------------------------------- copy */
  function copy(text, what){
    var answered = false;
    var done     = function(){ if (!answered) { answered = true; toast(what + " copied"); } };
    var fallback = function(){
      if (answered) return;
      answered = true;
      toast(legacy(text) ? what + " copied" : "Copy blocked, select the text instead");
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
      /* A writeText that never settles would leave the tap with no feedback. */
      setTimeout(fallback, 1200);
    } else { fallback(); }
  }
  /* Older path, and the rescue when the async clipboard is blocked (an
     unfocused document, a non-secure origin, a browser without permission). */
  function legacy(text){
    var ta = document.createElement("textarea"), copied = false;
    ta.value = text; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try { copied = document.execCommand("copy"); } catch(err){ copied = false; }
    ta.remove();
    return copied;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".cp"), function(btn){
    btn.addEventListener("click", function(e){
      e.preventDefault(); e.stopPropagation();
      var row = btn.closest("a.ln");
      copy(row.getAttribute("data-copy"), row.getAttribute("data-what"));
    });
  });

  var scan = document.getElementById("scan"), qrbtn = document.getElementById("qrbtn");

  function closeScan(){ scan.classList.remove("on"); qrbtn.focus(); }

  document.getElementById("scanclose").addEventListener("click", closeScan);
  scan.addEventListener("click", function(e){ if (e.target === scan) closeScan(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && scan.classList.contains("on")) closeScan();
  });

  /* ------------------------------------------------------- boot reveal */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.body.classList.remove("boot");
  } else {
    var lines = document.querySelectorAll(".rv");
    Array.prototype.forEach.call(lines, function(el, i){
      setTimeout(function(){ el.classList.add("in"); }, 90 + i * 85);
    });
    setTimeout(function(){ document.body.classList.remove("boot"); },
               90 + lines.length * 85 + 300);
  }
})();
</script>
</body>
</html>
